name: diag-mfx-proxy

# Builds tools/mfxproxy/mfxhook.dll: a DLL that is *injected* into sunshine.exe and times the two MFX
# calls that make up avcodec_send_frame() (MFXVideoENCODE_EncodeFrameAsync = submit,
# MFXVideoCORE_SyncOperation = wait for the GPU). It hooks the host process's GetProcAddress import, so
# it needs no export table of its own and no file is replaced on the target machine.
#
# Lives on its own branch and workflow so a failure here can never withhold the diagnostic Sunshine
# binary produced by diag-windows.yml.

on:
  push:
    branches:
      - diag-proxy
  workflow_dispatch:

jobs:
  proxy:
    name: mfxhook (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSVC
        id: msvc
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          echo vcvars=%VS%\VC\Auxiliary\Build\vcvars64.bat>>"%GITHUB_OUTPUT%"
          type "%GITHUB_OUTPUT%"

      - name: Build mfxhook.dll
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.vcvars }}"
          cd tools\mfxproxy
          cl /nologo /LD /O2 /W3 /Fe:mfxhook.dll mfxhook.c
          if errorlevel 1 exit /b 1
          dir mfxhook.dll

      - name: Confirm the DLL exports nothing (it only hooks the host's IAT)
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.vcvars }}"
          cd tools\mfxproxy
          dumpbin /exports mfxhook.dll > exports.txt
          type exports.txt
          findstr /c:"MFXVideoENCODE_EncodeFrameAsync" exports.txt >nul && (echo unexpected export ^& exit /b 1)
          echo no MFX exports, as intended
          rem cmd leaves ERRORLEVEL untouched by echo, so an earlier findstr miss would otherwise
          rem become this step's exit code even though nothing went wrong.
          exit /b 0

      - name: Upload mfxhook
        uses: actions/upload-artifact@v4
        with:
          name: mfx-proxy
          path: |
            tools/mfxproxy/mfxhook.dll
            tools/mfxproxy/exports.txt
          if-no-files-found: error

  # An independent DXGI Desktop Duplication present-rate meter. The desktop-cadence numbers so far came
  # either through Sunshine (which owns the display mode) or through ffmpeg's ddagrab (whose dup_frames
  # default pads the output and once made a 60 Hz mode report 119 fps), so a purpose-built meter with no
  # padding and no other client is needed to settle what the desktop really does.
  dxgidup:
    name: dxgidup (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSVC
        id: msvc
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          echo vcvars=%VS%\VC\Auxiliary\Build\vcvars64.bat>>"%GITHUB_OUTPUT%"

      - name: Build dxgidup.exe
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.vcvars }}"
          cd tools\dxgidup
          cl /nologo /O2 /W3 /EHsc /Fe:dxgidup.exe dxgidup.cpp /link dxgi.lib d3d11.lib
          if errorlevel 1 exit /b 1
          dir dxgidup.exe

      - name: Smoke test (lists this runner's outputs; must not crash)
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.vcvars }}"
          cd tools\dxgidup
          dxgidup.exe --seconds 1
          exit /b 0

      - name: Upload dxgidup
        uses: actions/upload-artifact@v4
        with:
          name: dxgidup
          path: tools/dxgidup/dxgidup.exe
          if-no-files-found: error
